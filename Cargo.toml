[workspace]
resolver = "2"
members = ["crates/omonat-core", "crates/omonat-store", "crates/omonat-bank", "crates/omonat-server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "AGPL-3.0-only"

[workspace.dependencies]
omonat-core = { path = "crates/omonat-core" }
omonat-store = { path = "crates/omonat-store" }
omonat-bank = { path = "crates/omonat-bank" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
ed25519-dalek = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
async-trait = "0.1"
